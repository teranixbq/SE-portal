<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">TAKSONOMI MASALAH DATA → DETEKSI → PENANGANAN</text><g><rect x="30" y="44" width="158" height="52" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" /><text x="109" y="72" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">Missing Values</text><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="109" y1="96" x2="109" y2="122" marker-end="url(#ah)" /></g><text x="109" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">MCAR/MAR/MNAR</text><text x="109" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">→ Imputasi / Flag</text></g><g><rect x="200" y="44" width="158" height="52" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.8" /><text x="279" y="72" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">Outlier & Anomaly</text><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="279" y1="96" x2="279" y2="122" marker-end="url(#ah)" /></g><text x="279" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">IQR fence / Isol.Forest</text><text x="279" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">→ Investigasi / Winsorize</text></g><g><rect x="370" y="44" width="158" height="52" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="449" y="72" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">Noise Data</text><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="449" y1="96" x2="449" y2="122" marker-end="url(#ah)" /></g><text x="449" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Pengukuran acak</text><text x="449" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">→ Binning / Moving Avg</text></g><g><rect x="540" y="44" width="158" height="52" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" /><text x="619" y="72" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">Duplikat & Drift</text><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="619" y1="96" x2="619" y2="122" marker-end="url(#ah)" /></g><text x="619" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Record linkage / Hashing</text><text x="619" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">→ Deduplikasi & Monitor</text></g><text x="360" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Aturan emas: JANGAN hapus massal tanpa catat — outlier bisa jadi sinyal fraud!</text><text x="360" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Selalu laporkan: n awal • % diubah • metode imputasi (reproducible)</text></svg>