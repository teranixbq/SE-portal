<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">LAPISAN KEAMANAN DATA LENGKAP (DEFENSE IN DEPTH)</text><g><rect x="18" y="48" width="129" height="66" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" /><text x="82" y="74" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">TLS 1.2+ / HTTPS</text><text x="82" y="94" text-anchor="middle" font-size="10.5" fill="#475569">In-Transit Encryption</text></g><g><rect x="157" y="48" width="129" height="66" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" /><text x="221" y="74" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">AES-256 + KMS</text><text x="221" y="94" text-anchor="middle" font-size="10.5" fill="#475569">At-Rest Encryption</text></g><g><rect x="296" y="48" width="129" height="66" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" /><text x="360" y="74" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">RBAC & Least Priv.</text><text x="360" y="94" text-anchor="middle" font-size="10.5" fill="#475569">Kontrol Akses & Audit</text></g><g><rect x="435" y="48" width="129" height="66" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="499" y="74" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">Masking & Tokenisasi</text><text x="499" y="94" text-anchor="middle" font-size="10.5" fill="#475569">Privasi PII (NIM/NIK)</text></g><g><rect x="574" y="48" width="129" height="66" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.8" /><text x="638" y="74" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">bcrypt / Argon2</text><text x="638" y="94" text-anchor="middle" font-size="10.5" fill="#475569">Hash Password Aman</text></g><rect x="40" y="132" width="640" height="58" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6" /><text x="360" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Dimensi Kualitas: Akurasi • Kelengkapan • Konsistensi • Ketepatan Waktu • Validitas • Keunikan</text><text x="360" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">SLO Kualitas Data: Freshness < 1 jam & Completeness > 99% — Batch gagal otomatis dikarantina</text><text x="360" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Regulasi: UU PDP No. 27/2022 (Persetujuan, Hak Hapus, Notifikasi Kebocoran) & Standar GDPR</text><text x="360" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Optimasi: Ukur metrik query plan (EXPLAIN) → Partisi data → Indeks B-Tree → Caching memori</text></svg>