<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">POLA ANTI-LEAKAGE: FIT HANYA DI TRAIN DATASET</text><g><rect x="30" y="48" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" /><text x="130" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">TRAIN SET</text><text x="130" y="98" text-anchor="middle" font-size="11" fill="#475569">fit scaler/PCA di sini</text></g><g><rect x="490" y="48" width="200" height="70" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6" /><text x="590" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">TEST SET</text><text x="590" y="98" text-anchor="middle" font-size="11" fill="#475569">hanya transform!</text></g><text x="360" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">— — — ✂ split — — —</text><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="234" y1="83" x2="486" y2="83" marker-end="url(#ah)" /></g><rect x="60" y="136" width="600" height="80" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6" /><text x="360" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Rescaling: min-max [0,1] • z-score (ML jarak) • robust (median/IQR) • log untuk skew</text><text x="360" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Reduksi: PCA (95% variance) • seleksi fitur • sampling stratified • agregasi window</text><text x="360" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Simpan: Parquet + Snappy/ZSTD (kolom, terkompresi) — encoding: one-hot vs ordinal</text></svg>