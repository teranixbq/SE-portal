<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">KOMPARASI: DATA WAREHOUSE vs DATA LAKE vs DATA LAKEHOUSE</text><g><rect x="20" y="48" width="210" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" /><text x="125" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Data Warehouse</text><text x="125" y="101" text-anchor="middle" font-size="11" fill="#475569">Skema-on-Write, SQL/BI Cepat</text></g><g><rect x="255" y="48" width="210" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" /><text x="360" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Data Lake</text><text x="360" y="101" text-anchor="middle" font-size="11" fill="#475569">Skema-on-Read, Multi-format Murah</text></g><g><rect x="490" y="48" width="210" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" /><text x="595" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Data Lakehouse</text><text x="595" y="101" text-anchor="middle" font-size="11" fill="#475569">Lake Murah + Transaksi ACID & SQL</text></g><text x="360" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Format Tabel Terbuka: Apache Iceberg / Delta Lake / Apache Hudi (Time travel & ACID)</text><rect x="40" y="162" width="640" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="360" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Studi Kasus: Log Mentah (Lake) → Fakta & Dimensi (Warehouse) → Data Mart Terpisah → Dashboard Eksekutif</text><text x="360" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Tanpa tata kelola metadata = DATA SWAMP. Paradigma Data Mesh: kepemilikan data berbasis domain terdistribusi.</text></svg>