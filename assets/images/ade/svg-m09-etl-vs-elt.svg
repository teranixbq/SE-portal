<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">ARSITEKTUR PIPELINE: ETL vs ELT + QUALITY GATES</text><g><rect x="20" y="50" width="320" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" /><text x="180" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">ETL</text><text x="180" y="93" text-anchor="middle" font-size="11" fill="#475569">Extract → Transform → Load (Warehouse Tradisional)</text></g><g><rect x="380" y="50" width="320" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" /><text x="540" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">ELT</text><text x="540" y="93" text-anchor="middle" font-size="11" fill="#475569">Extract → Load → Transform (Cloud Lakehouse / dbt)</text></g><text x="360" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Ingest → ⛔ VALIDATE (not-null • unique • range) → Transform (idempoten!) → Load (upsert) → Orchestrate</text><rect x="40" y="148" width="640" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="360" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Orkestrasi: Airflow / Prefect (retry • SLA • alerting) — Observability: freshness • volume • lineage</text><text x="360" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Batch gagal? KARANTINA ke folder quarantine, jangan lolos ke Gold. Incremental via watermark.</text><text x="360" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Pola Medallion: 🥉 Bronze (mentah) → 🥈 Silver (bersih) → 🥇 Gold (agregat bisnis siap BI)</text></svg>