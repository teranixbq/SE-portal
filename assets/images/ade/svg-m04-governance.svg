<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">TATA KELOLA DATA: KERANGKA DAMA + SIKLUS FAIR</text><g><circle cx="90" cy="80" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="90" y="88" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">F</text><text x="90" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Findable</text><text x="90" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">PID/DOI + metadata</text></g><g><circle cx="270" cy="80" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="270" y="88" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">A</text><text x="270" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Accessible</text><text x="270" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">protokol standar</text></g><g><circle cx="450" cy="80" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="450" y="88" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">I</text><text x="450" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Interoperable</text><text x="450" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">format terbuka</text></g><g><circle cx="630" cy="80" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="630" y="88" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">R</text><text x="630" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e29