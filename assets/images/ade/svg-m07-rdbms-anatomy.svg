<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e293b" /></marker></defs><text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">ANATOMI RDBMS (POSTGRESQL ARCHITECTURE)</text><g><rect x="20" y="50" width="120" height="60" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.6" /><text x="80" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Client</text><text x="80" y="95" text-anchor="middle" font-size="11" fill="#475569">SQL Query</text></g><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="144" y1="80" x2="164" y2="80" marker-end="url(#ah)" /></g><g><rect x="168" y="50" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" /><text x="243" y="76" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">Parser + Optimizer</text><text x="243" y="95" text-anchor="middle" font-size="11" fill="#475569">Query Plan</text></g><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="322" y1="80" x2="342" y2="80" marker-end="url(#ah)" /></g><g><rect x="346" y="50" width="130" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" /><text x="411" y="76" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">Executor</text><text x="411" y="95" text-anchor="middle" font-size="11" fill="#475569">MVCC + Lock</text></g><g stroke="#1e293b" stroke-width="2" fill="none"><line x1="480" y1="80" x2="500" y2="80" marker-end="url(#ah)" /></g><g><rect x="504" y="50" width="196" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" /><text x="602" y="76" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">Storage Engine</text><text x="602" y="95" text-anchor="middle" font-size="11" fill="#475569">Heap + B-tree + WAL</text></g><rect x="20" y="130" width="680" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" /><text x="360" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">ACID: Atomicity • Consistency • Isolation • Durability — EXPLAIN ANALYZE untuk tuning</text><text x="360" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Index mempercepat baca, memperlambat tulis — isolasi: read committed → serializable</text><text x="360" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Peran modern: system of record OLTP → analitik di-offload via CDC ke warehouse/lakehouse</text><text x="360" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Pilih RDBMS bila: join kompleks + ACID kuat. Pilih NoSQL bila: tulis masif + skema fleksibel.</text></svg>